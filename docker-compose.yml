services:
  api:
    build:
      context: .
      dockerfile: src/VoiceToTicket.Api/Dockerfile
    ports:
      - "5080:8080"
    env_file:
      - path: .env
        required: false
    # Stt:BaseUrl defaults to http://stt:8000. Started, not healthy: a cold model download takes minutes
    # and the text-to-ticket path must not wait for it.
    depends_on:
      stt:
        condition: service_started

  # Speech-to-text (Speaches, faster-whisper behind an OpenAI-compatible API).
  # The model downloads on start (PRELOAD_MODELS) into the named volume, so the first start
  # is slow and later starts reuse it.
  stt:
    image: ghcr.io/speaches-ai/speaches:0.9.0-rc.3-cpu
    ports:
      - "8000:8000"
    environment:
      PRELOAD_MODELS: '["Systran/faster-whisper-medium.en"]'
      STT_MODEL_TTL: "-1"
      WHISPER__COMPUTE_TYPE: int8
    volumes:
      - stt-models:/home/ubuntu/.cache/huggingface/hub
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 600s
    restart: unless-stopped

volumes:
  stt-models:
