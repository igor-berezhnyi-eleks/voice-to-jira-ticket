# This branch's Deploy workflow (deployment plan revision 3, D25–D28, section 4.3). It deploys our app as its own
# Compose project, voice-to-ticket-alt, next to the colleague's app; the colleague's Caddy (project voice-to-jira, from
# main) serves it at https://10.17.89.14/alt/. Their site at https://10.17.89.14/ keeps running.
# Actions → Deploy → Run workflow → pick this branch. The file keeps main's name and path, because GitHub shows
# "Run workflow" only for workflows that also exist on the default branch. Never merge this branch into main: this
# file would replace theirs.
name: Deploy

on:
  workflow_dispatch:

# Never run two deployments at once; let a running one finish. Same group as the colleague's workflow, so the two
# apps never build at the same time on the 8 GB VM.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Self-hosted runner on the VM (10.17.89.14 is not reachable from GitHub-hosted runners).
    runs-on: self-hosted
    env:
      # Secrets live outside the workspace: checkout wipes untracked files, including .env.
      COMPOSE: >-
        docker compose -p voice-to-ticket-alt
        -f docker-compose.alt.yml
        --env-file /opt/voice-to-jira/.env
    steps:
      - uses: actions/checkout@v4

      # alt-api joins the colleague's network so their Caddy can reach it. It exists only while their stack is up.
      - name: Check the colleague's network
        run: |
          if ! docker network inspect voice-to-jira_default > /dev/null 2>&1; then
            echo "::error::Network voice-to-jira_default is missing. Deploy main first (the colleague's stack with Caddy), then run this again."
            exit 1
          fi

      # Not --force-recreate: that would restart stt and reload both speech models on every deploy.
      - name: Build and start
        run: $COMPOSE up -d --build --remove-orphans

      # Through the colleague's Caddy, so it also checks the /alt/ route (P5). It does not wait for stt: a cold start
      # loads about 4.3 GB of models, and typing a report works without them.
      - name: Health check
        run: curl -fsSk --retry 15 --retry-delay 2 --retry-connrefused https://10.17.89.14/alt/health

      # Stands in for signing in to the VM. Always runs, never fails the deploy.
      - name: Status
        if: always()
        continue-on-error: true
        run: |
          set +e
          # Plain docker commands, not $COMPOSE: they also work when the compose file cannot be loaded
          # (for example a missing ANTHROPIC_API_KEY), which is when the status matters most.
          for project in voice-to-ticket-alt voice-to-jira; do
            echo "--- containers of $project"
            docker ps -a --filter label=com.docker.compose.project=$project
          done
          docker stats --no-stream
          echo "--- stt log (last 30 lines of the last 15 minutes)"
          stt=$(docker ps -aq --filter label=com.docker.compose.project=voice-to-ticket-alt --filter label=com.docker.compose.service=stt)
          if [ -n "$stt" ]; then docker logs --since 15m --tail 30 "$stt"; else echo "no stt container"; fi
          echo "--- the colleague's site through the same Caddy (expect 200)"
          curl -sSk -o /dev/null -w "%{http_code}\n" https://10.17.89.14/
          echo "--- Hugging Face from the VM (expect 200)"
          curl -sS -o /dev/null -w "%{http_code}\n" https://huggingface.co/Systran/faster-whisper-medium.en/resolve/main/config.json

      - name: Remove dangling images
        run: docker image prune -f
