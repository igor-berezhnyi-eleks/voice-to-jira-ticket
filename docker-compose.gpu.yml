# NVIDIA GPU override. UNTESTED: the reference laptop has an Intel Arc GPU only.
# Use: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up
# Needs an NVIDIA GPU, current drivers and the NVIDIA Container Toolkit (Docker Desktop: WSL2 backend).
services:
  stt:
    image: ghcr.io/speaches-ai/speaches:0.9.0-rc.3-cuda
    environment:
      WHISPER__COMPUTE_TYPE: float16
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
